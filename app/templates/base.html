<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}media-bridge{% endblock %}</title>
  <meta name="description" content="Attach images to Buffer posts without hosting them yourself. Built on the Buffer API.">
  <link rel="icon" href="{{ url_for('static', path='icon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="{{ url_for('static', path='icon.svg') }}#mark"/></svg>
      <span>media-bridge</span>
    </a>
    <nav class="topnav">{% block nav %}<a href="/privacy">Privacy</a>{% endblock %}</nav>
  </header>
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Built on the Buffer API. Not affiliated with or endorsed by Buffer.</span>
    <span><a href="/privacy">Privacy</a> · <a href="https://github.com/amralaaalex/Media-bridge-4-Buffer">Source</a></span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
